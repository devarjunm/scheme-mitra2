name: Scheme Mitra checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-secret-change-me-before-deployment-000000000000
          DATABASE_URL: sqlite:///./backend/data/ci-test.sqlite3
          DEMO_MODE: 'true'
          SEED_SCHEMES: 'true'
        run: pytest -q

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
